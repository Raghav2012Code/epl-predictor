<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <rect width="128" height="128" rx="20" fill="#000000" />
  
  <!-- Crown on Top -->
  <path
    d="M38 48 L44 32 L54 42 L64 24 L74 42 L84 32 L90 48 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <path
    d="M44 48 Q64 42 84 48"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Football Outer Circle -->
  <circle
    cx="64"
    cy="76"
    r="36"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.5"
  />

  <!-- Geometric Hexagonal / Pentagon Facets inside Ball -->
  <!-- Central facet -->
  <polygon
    points="64,62 74,69 70,81 58,81 54,69"
    fill="none"
    stroke="#A1A1AA"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Radiating seam lines to outer ring -->
  <line x1="64" y1="62" x2="64" y2="46" stroke="#A1A1AA" stroke-width="2" />
  <line x1="74" y1="69" x2="88" y2="60" stroke="#A1A1AA" stroke-width="2" />
  <line x1="70" y1="81" x2="84" y2="95" stroke="#A1A1AA" stroke-width="2" />
  <line x1="58" y1="81" x2="44" y2="95" stroke="#A1A1AA" stroke-width="2" />
  <line x1="54" y1="69" x2="40" y2="60" stroke="#A1A1AA" stroke-width="2" />

  <!-- Lower and side perimeter accents -->
  <line x1="64" y1="102" x2="64" y2="112" stroke="#52525B" stroke-width="2" />
  <line x1="84" y1="95" x2="96" y2="88" stroke="#52525B" stroke-width="2" />
  <line x1="44" y1="95" x2="32" y2="88" stroke="#52525B" stroke-width="2" />

  <!-- Ascending Prediction Trend Arrow -->
  <polyline
    points="34,98 48,82 56,88 72,70 94,48"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrowhead -->
  <polygon
    points="94,48 83,49 89,59"
    fill="#FFFFFF"
  />

  <!-- Telemetry Nodes on Arrow -->
  <circle cx="34" cy="98" r="3.5" fill="#FFFFFF" />
  <circle cx="48" cy="82" r="3" fill="#000000" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="56" cy="88" r="3" fill="#000000" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="72" cy="70" r="3" fill="#000000" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
