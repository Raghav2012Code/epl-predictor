<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="2" y="2" width="60" height="60" rx="4" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="3" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.9"/>
  <!-- Pitch mark, Lucide stroke language: round caps, geometric -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <!-- Touchline -->
    <rect x="14" y="12" width="36" height="40" rx="1"/>
    <!-- Halfway line -->
    <line x1="14" y1="32" x2="50" y2="32"/>
    <!-- Centre circle -->
    <circle cx="32" cy="32" r="8.5"/>
  </g>
  <!-- Match ball: centre spot -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
</svg>
